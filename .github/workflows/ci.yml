name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and WASM smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      # Wasmtime's debug symbols otherwise consume most of a hosted runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-wasip2
          rustup override set 1.99.1

      - name: Check formatting and OIDC configuration
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/hello/fn/Cargo.toml -- --check
          python3 scripts/test-oidc-config.py

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/hello/fn/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.99.1-nodebug-${{ hashFiles('Cargo.lock', 'examples/hello/fn/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-1.99.1-nodebug-

      # Keep existing style warnings visible; new compiler/lint errors fail CI.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build workspace and real WASM fixture
        run: |
          cargo build --workspace --locked
          cargo build --manifest-path examples/hello/fn/Cargo.toml --release --target wasm32-wasip2 --locked

      - name: Production rejection and real WASM rollback smoke
        run: python3 scripts/security-e2e.py
