[package]
name = "pushit-controller"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8", features = ["multipart"] }
wasmtime = { version = "35", features = ["component-model", "component-model-async"] }
wasmtime-wasi = "35"
wasmtime-wasi-http = "35"
rusqlite = { version = "0.32", features = ["bundled"] }
age = "0.11"
jsonwebtoken = "9"
serde_yaml = "0.9"
tar = "0.4"
flate2 = "1"
askama = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
mime_guess = "2"
opendal = { version = "0.59", features = ["services-s3", "services-fs"] }
futures = "0.3"
bytes = "1"
parking_lot = "0.12"
http = "1"
hyper = "1"
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "sqlite", "chrono"] }
argon2 = "0.5"
serde_urlencoded = "0.7"
rand = "0.8"
chrono = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
