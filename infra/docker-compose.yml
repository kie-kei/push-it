# Local test:   docker compose up -d controller        # platform only, http://localhost:9100
# Full stack:   docker compose --profile edge up -d    # + Caddy (80/443) + Keycloak
# External KC:  docker compose --profile edge-external up -d
#               # + Caddy, Keycloak runs OUTSIDE compose; point Caddy's auth.*
#               # upstream and controller's PUSHIT_OIDC_* at it manually.
services:
  controller:
    build: ..
    # Dockerfile lives at repo root; compose file is infra/
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      # scenario switch comes from .env: PUSHIT_DEV=1 → dev, PUSHIT_DEV= (empty) → OIDC.
      # NOTE: no colon in ${PUSHIT_DEV-1} — empty must stay empty (scenario 2).
      PUSHIT_DEV: ${PUSHIT_DEV-1}
      PUSHIT_BASE_DOMAIN: ${PUSHIT_BASE_DOMAIN:-localhost}
      PUSHIT_OIDC_ISSUER: ${PUSHIT_OIDC_ISSUER:-}
      PUSHIT_OIDC_CLIENT_ID: ${PUSHIT_OIDC_CLIENT_ID:-pushit-platform}
      PUSHIT_OIDC_CLIENT_SECRET: ${PUSHIT_OIDC_CLIENT_SECRET:-}
      PUSHIT_SESSION_KEY: ${PUSHIT_SESSION_KEY:-}
    volumes:
      - controller_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: [edge, edge-external]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # where auth.* requests go: local keycloak service or your external KC
      KC_UPSTREAM: ${KC_UPSTREAM:-keycloak:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [controller]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    profiles: [edge]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-auth.apps.internal.lan}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Realm import resolves this inside Keycloak, not on the Compose host.
      # Keep optional here so controller-only dev does not require OIDC secrets.
      PUSHIT_OIDC_CLIENT_SECRET: ${PUSHIT_OIDC_CLIENT_SECRET:-}
    command: start --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm-pushit.json:/opt/keycloak/data/import/realm-pushit.json:ro

volumes:
  controller_data:
  caddy_data:
  caddy_config:
  keycloak_data:
