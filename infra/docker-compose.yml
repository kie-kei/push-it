# Local test:   docker compose up -d controller      # platform only, http://localhost:9100
# Full stack:   docker compose --profile edge up -d  # + Caddy (80/443) + Keycloak
services:
  controller:
    build: ..
    # Dockerfile lives at repo root; compose file is infra/
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      PUSHIT_DEV: "1"            # dev mode: CLI works with --dev, no OIDC needed
      PUSHIT_BASE_DOMAIN: ${PUSHIT_BASE_DOMAIN:-localhost}
    volumes:
      - controller_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: [edge]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [controller, keycloak]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    profiles: [edge]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-auth.apps.internal.lan}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: start --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm-pushit.json:/opt/keycloak/data/import/realm-pushit.json:ro

volumes:
  controller_data:
  caddy_data:
  caddy_config:
  keycloak_data:
